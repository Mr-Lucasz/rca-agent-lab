defaults:
  corrective: {owner_role: "Tech Lead", horizon: "0–2 semanas", success_metric: "Reproduzir o defeito antes e comprovar sua ausência após a correção."}
  detective: {owner_role: "QA / SRE", horizon: "2–4 semanas", success_metric: "Aumentar detecção pré-produção e reduzir MTTD do mecanismo."}
  preventive: {owner_role: "Engineering Manager / Product", horizon: "1–2 ciclos", success_metric: "Zero recorrência confirmada do mecanismo por dois ciclos."}
by_root_cause:
  requirements:
    corrective: "Revisar critério de aceite do fluxo afetado com exemplos e contraexemplos."
    detective: "Adicionar teste de aceite rastreável ao requisito antes do merge."
    preventive: "Adotar checklist de refinamento com decisão explícita para casos-limite."
  implementation:
    corrective: "Isolar a condição de falha e adicionar teste de regressão que falha antes do patch."
    detective: "Executar o teste de regressão no gate de CI do módulo."
    preventive: "Adicionar regra estática ou padrão de implementação para bloquear a classe de falha."
  integration-contract:
    corrective: "Corrigir o contrato e versionar payloads incompatíveis."
    detective: "Adicionar contract test produtor-consumidor no CI."
    preventive: "Governar evolução de schema com compatibilidade e janela de depreciação."
  configuration:
    corrective: "Alinhar configuração do ambiente afetado com fonte versionada."
    detective: "Validar drift e parâmetros obrigatórios antes do deploy."
    preventive: "Gerenciar configuração como código com revisão e trilha de mudança."
  data-quality:
    corrective: "Corrigir registros afetados e tornar a operação idempotente."
    detective: "Adicionar constraint, reconciliação ou alerta de integridade."
    preventive: "Definir contrato de dados e estratégia de migração reversível."
  test-gap:
    corrective: "Criar teste de regressão para o comportamento observado."
    detective: "Adicionar o cenário à suíte executada no gate relevante."
    preventive: "Usar análise de risco para exigir cenários de borda do módulo."
  deployment:
    corrective: "Corrigir o artefato e validar rollback ou roll-forward."
    detective: "Adicionar smoke test pós-deploy e health gate."
    preventive: "Adotar rollout gradual com critério automático de interrupção."
  observability-gap:
    corrective: "Instrumentar o caminho afetado com contexto correlacionável."
    detective: "Criar alerta baseado no sintoma mais precoce observável."
    preventive: "Definir requisito de observabilidade no Definition of Done."
  unknown:
    corrective: "Coletar a evidência faltante antes de alterar o mecanismo."
    detective: "Criar captura temporária e limitada para reproduzir o evento."
    preventive: "Melhorar o template de bug com campos que faltaram nesta análise."

